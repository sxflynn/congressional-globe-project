[project]
name = "congressional-globe-corpus"
version = "0.1.0"
description = "Provenance-first corpus tooling for The Congressional Globe"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
  "lxml>=5.3",
  "openai>=1.109",
  "pillow>=11.0",
  "pydantic>=2.10",
  "python-dotenv>=1.1",
  "sqlalchemy>=2.0",
  "streamlit>=1.66.1",
]

[project.scripts]
globe = "congressional_globe.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/congressional_globe"]

[dependency-groups]
dev = [
  "complexipy>=4.1",
  "pytest>=8.3",
  "ruff>=0.11",
  "ty>=0.0.1a24",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.isort]
known-first-party = ["congressional_globe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
