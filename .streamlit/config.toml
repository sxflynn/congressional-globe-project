# Style both system themes without forcing a light/dark preference.
[theme.light]
primaryColor = "#7f382d"
backgroundColor = "#faf6ed"
secondaryBackgroundColor = "#f0e8d9"
textColor = "#302a22"
headingFont = "serif"
baseRadius = "small"

[theme.dark]
primaryColor = "#dcad85"
backgroundColor = "#1e1b17"
secondaryBackgroundColor = "#2a251f"
textColor = "#eee5d4"
headingFont = "serif"
baseRadius = "small"
